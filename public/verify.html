<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify - Watobot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-blue-50 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <!-- Header -->
            <div class="text-center mb-8">
                <img alt="Watobot" class="w-full max-w-xs mx-auto object-contain" src="./logo.png" />
            </div>

            <!-- Loading State -->
            <div id="loading" class="bg-white rounded-lg shadow-lg p-8 text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-green-600 mx-auto mb-4"></div>
                <p class="text-gray-600">Verifying your access...</p>
            </div>

            <!-- Error State -->
            <div id="error" class="hidden bg-white rounded-lg shadow-lg p-8">
                <div class="text-center">
                    <svg class="mx-auto h-12 w-12 text-red-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">Verification Failed</h2>
                    <p id="errorMessage" class="text-gray-600 mb-6">Invalid or expired link.</p>
                    <a href="/" class="inline-block bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition">
                        Return to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Same origin locally (server.js serves public/ + /api together);
        // split into a dedicated API subdomain once served from GitHub Pages.
        const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
            ? ''
            : 'https://api.watobot.xyz';

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = urlParams.get('email');
        const rawNext = urlParams.get('next');

        if (!token) {
            showError('No verification token provided');
        } else {
            verifyToken();
        }

        // `next` only ever needs to survive a same-origin redirect — reject
        // anything that isn't a bare relative path (an absolute/protocol-
        // relative URL here would make this an open redirect, since the
        // value round-trips through an emailed link).
        function safeNext(value) {
            if (typeof value !== 'string') return null;
            if (!/^\/[^/\\]/.test(value)) return null;
            return value;
        }

        // Thin by design — this page's only job is to consume the token and
        // decide where the user actually needs to go next. The WhatsApp
        // connect/QR wizard itself lives at whatsapp-connect.html, which
        // re-checks connection status on its own and skips back to the
        // dashboard if it's already connected — so this never needs to know
        // about whatsappConnected itself.
        async function verifyToken() {
            try {
                const response = await fetch(`${API_BASE}/api/verify/${token}`);
                const data = await response.json();

                if (!response.ok) {
                    showError(data.error || 'Verification failed');
                    return;
                }

                localStorage.setItem('authToken', token);
                if (email) localStorage.setItem('userEmail', email);

                const next = safeNext(rawNext);
                if (next) {
                    window.location.href = next;
                } else {
                    window.location.href = `/whatsapp-connect.html?token=${token}`;
                }
            } catch (error) {
                console.error('Verification error:', error);
                showError('Failed to verify. Please try again.');
            }
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('errorMessage').textContent = message;
        }
    </script>
</body>
</html>
