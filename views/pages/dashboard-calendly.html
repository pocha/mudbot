        </div>
<!--#include partial="dashboard-footer"-->
      </main>

<!--#include partial="dashboard-support-modal"-->

    <script type="module">
      (function highlightNav() {
        const page = (location.pathname.split("/").pop() || "index.html").replace(".html", "");
        const key = page || "index";
        const link = document.querySelector(`#dashboard-nav a[data-nav="${key}"]`);
        if (link) {
          link.classList.add("bg-primary-container", "text-on-primary-container", "font-bold");
          link.classList.remove("text-on-surface-variant");
        }
      })();

      document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const authToken = urlParams.get("token") || localStorage.getItem("authToken");

        if (!authToken) {
          alert("Authentication required. Redirecting to home page...");
          window.location.href = "/";
          return;
        }
        localStorage.setItem("authToken", authToken);

        document.getElementById("logout-btn").addEventListener("click", () => {
          showLogoutModal({ isFullLogout: true });
        });
      });

      // ── Logout modal ───────────────────────────────────

      function showLogoutModal({ isFullLogout }) {
        const modal = document.getElementById("logoutModal");
        const title = document.getElementById("logoutModalTitle");
        const body = document.getElementById("logoutModalBody");
        const confirmBtn = document.getElementById("logoutModalConfirm");
        const cancelBtn = document.getElementById("logoutModalCancel");

        title.textContent = isFullLogout ? "Log out of WatoBot" : "Disconnect WhatsApp";
        confirmBtn.dataset.isFullLogout = isFullLogout ? "1" : "0";

        body.innerHTML = `
        <div class="flex items-center gap-3 text-on-surface-variant">
            <div class="w-5 h-5 border-2 border-primary border-t-transparent rounded-full animate-spin flex-shrink-0"></div>
            <p class="text-body-md">Asking WhatsApp to remove this device… please wait.</p>
        </div>
        <p id="logoutModalError" class="hidden mt-3 text-sm text-error">Something went wrong. Please try again.</p>
    `;
        confirmBtn.textContent = "Continue — device is removed";
        confirmBtn.disabled = true;
        cancelBtn.disabled = false;
        modal.classList.remove("hidden");

        const authToken = localStorage.getItem("authToken");
        const API_BASE =
          location.hostname === "localhost" || location.hostname === "127.0.0.1"
            ? window.location.origin
            : "https://api.watobot.xyz";

        fetch(`${API_BASE}/api/whatsapp/logout`, {
          method: "POST",
          headers: { Authorization: `Bearer ${authToken}` },
        })
          .catch(() => {})
          .finally(() => {
            body.innerHTML = `
            <p class="text-on-surface-variant text-body-md mb-3">
                We've asked WhatsApp to remove this device. Please verify on your phone:
            </p>
            <ol class="space-y-2 text-body-md text-on-surface-variant list-decimal list-inside">
                <li>Open WhatsApp → tap <strong>Linked Devices</strong></li>
                <li>If <strong>"Google Chrome"</strong> is still listed, tap it and choose <strong>Log out</strong></li>
                <li>Once it's gone, click <strong>Continue</strong> below</li>
            </ol>
            <p id="logoutModalError" class="hidden mt-3 text-sm text-error">Something went wrong. Please try again.</p>
        `;
            confirmBtn.disabled = false;
          });
      }

      async function handleLogoutConfirm() {
        const confirmBtn = document.getElementById("logoutModalConfirm");
        const errMsg = document.getElementById("logoutModalError");
        const isFullLogout = confirmBtn.dataset.isFullLogout === "1";
        const authToken = localStorage.getItem("authToken");
        const API_BASE =
          location.hostname === "localhost" || location.hostname === "127.0.0.1"
            ? window.location.origin
            : "https://api.watobot.xyz";

        confirmBtn.disabled = true;
        confirmBtn.textContent = "Cleaning up…";
        errMsg?.classList.add("hidden");

        try {
          const res = await fetch(`${API_BASE}/api/whatsapp/logout/confirm`, {
            method: "POST",
            headers: { Authorization: `Bearer ${authToken}` },
          });
          if (!res.ok) throw new Error("confirm failed");

          if (isFullLogout) {
            localStorage.removeItem("authToken");
            window.location.href = "/";
          } else {
            window.location.href = `/whatsapp-connect.html?token=${authToken}`;
          }
        } catch {
          errMsg?.classList.remove("hidden");
          confirmBtn.disabled = false;
          confirmBtn.textContent = "Continue — device is removed";
        }
      }

      document.addEventListener("click", (e) => {
        if (e.target.id === "logoutModalConfirm") handleLogoutConfirm();
        if (e.target.id === "logoutModalCancel")
          document.getElementById("logoutModal").classList.add("hidden");
      });

      function openSupport() {
        const modal = document.getElementById("supportModal");
        const now = new Date();
        const istHour = ((now.getUTCHours() * 60 + now.getUTCMinutes() + 330) / 60) % 24;
        const available = istHour >= 9 && istHour < 19;
        document.getElementById("support-available").classList.toggle("hidden", !available);
        document.getElementById("support-unavailable").classList.toggle("hidden", available);
        modal.classList.remove("hidden");
      }
      function closeSupport() {
        document.getElementById("supportModal").classList.add("hidden");
      }

      window.openSupport = openSupport;
      window.closeSupport = closeSupport;
    </script>

    <!-- Logout modal -->
<!--#include partial="dashboard-logout-modal"-->
  </body>
</html>
