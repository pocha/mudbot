<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{{title}}</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Plus+Jakarta+Sans:wght@100..900&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Style Guidance Implementation -->
    <script src="/assets/theme.js"></script>
    <link rel="stylesheet" href="/assets/theme.css" />
  </head>
  <body class="bg-surface text-on-surface font-body-md overflow-hidden">
    <!-- Top Navigation -->
    <header
      class="flex justify-between items-center w-full px-gutter py-2 sticky top-0 z-50 bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-on-surface-variant shadow-sm h-16"
    >
      <div class="flex items-center gap-4">
        <span class="font-headline-md text-headline-md font-bold"
          ><span class="text-primary">Wato</span
          ><span class="text-on-surface">Bot</span></span
        >
      </div>
      <div class="flex items-center gap-4">
        <button
          onclick="openSupport()"
          class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors"
        >
          Support
        </button>
        <button
          id="logout-btn"
          class="flex items-center gap-2 text-error hover:bg-error/10 px-3 py-2 rounded-xl transition-all font-label-md"
        >
          <span class="material-symbols-outlined text-[20px]">logout</span>
          <span class="hidden md:inline">Logout</span>
        </button>
      </div>
    </header>
    <div class="flex h-[calc(100vh-64px)] overflow-hidden justify-center">
      <!-- Main Workspace -->
      <main class="flex-1 overflow-y-auto custom-scrollbar p-6 bg-background">
        <div class="max-w-6xl mx-auto space-y-stack-gap">
          <!-- Dashboard section nav -->
          <nav id="dashboard-nav" class="flex items-center gap-1 flex-wrap">
            <a href="index.html" data-nav="index" class="px-3 py-1.5 rounded-lg font-label-md text-sm text-on-surface-variant hover:bg-surface-container transition-colors">Overview</a>
            <a href="schedules.html" data-nav="schedules" class="px-3 py-1.5 rounded-lg font-label-md text-sm text-on-surface-variant hover:bg-surface-container transition-colors">Scheduled Messages</a>
            <a href="faqs.html" data-nav="faqs" class="px-3 py-1.5 rounded-lg font-label-md text-sm text-on-surface-variant hover:bg-surface-container transition-colors">Group FAQs</a>
            <a href="calendly.html" data-nav="calendly" class="px-3 py-1.5 rounded-lg font-label-md text-sm text-on-surface-variant hover:bg-surface-container transition-colors">Calendly</a>
          </nav>
