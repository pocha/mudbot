<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>{{title}}</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Plus+Jakarta+Sans:wght@100..900&amp;display=swap"
      rel="stylesheet"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Style Guidance Implementation -->
    <script src="/assets/theme.js"></script>
    <link rel="stylesheet" href="/assets/theme.css" />
  </head>
  <body class="bg-surface text-on-surface font-body-md overflow-hidden">
    <!-- Top Navigation -->
    <header
      class="flex justify-between items-center w-full px-gutter py-2 sticky top-0 z-50 bg-surface dark:bg-inverse-surface border-b border-outline-variant dark:border-on-surface-variant shadow-sm h-16"
    >
      <div class="flex items-center gap-4">
        <span class="font-headline-md text-headline-md font-bold"
          ><span class="text-primary">Wato</span
          ><span class="text-on-surface">Bot</span></span
        >
      </div>
      <div class="flex items-center gap-4">
        <button
          onclick="openSupport()"
          class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors"
        >
          Support
        </button>
        <button
          id="logout-btn"
          class="flex items-center gap-2 text-error hover:bg-error/10 px-3 py-2 rounded-xl transition-all font-label-md"
        >
          <span class="material-symbols-outlined text-[20px]">logout</span>
          <span class="hidden md:inline">Logout</span>
        </button>
      </div>
    </header>
    <div class="flex h-[calc(100vh-64px)] overflow-hidden">
      <!-- Dashboard section nav — icon-only rail below lg:, icon+label
           sidebar at lg: and up. Purely viewport-driven (no JS toggle, no
           persisted state) — matches the rest of this app's no-framework,
           no-client-state-beyond-auth-token approach. -->
      <aside
        id="dashboard-nav"
        class="w-16 lg:w-56 flex-shrink-0 border-r border-outline-variant bg-surface-container-lowest flex flex-col gap-1 py-4 px-2 overflow-y-auto"
      >
        <a href="index.html" data-nav="index" title="Dashboard" class="flex items-center gap-3 px-2 lg:px-3 py-2.5 rounded-lg font-label-md text-sm text-on-surface-variant hover:bg-surface-container transition-colors justify-center lg:justify-start">
          <span class="material-symbols-outlined text-[22px] flex-shrink-0">insights</span>
          <span class="hidden lg:inline truncate">Dashboard</span>
        </a>
        <a href="schedules.html" data-nav="schedules" title="Scheduled Messages" class="flex items-center gap-3 px-2 lg:px-3 py-2.5 rounded-lg font-label-md text-sm text-on-surface-variant hover:bg-surface-container transition-colors justify-center lg:justify-start">
          <span class="material-symbols-outlined text-[22px] flex-shrink-0">schedule_send</span>
          <span class="hidden lg:inline truncate">Scheduled Messages</span>
        </a>
        <a href="faqs.html" data-nav="faqs" title="Group FAQs" class="flex items-center gap-3 px-2 lg:px-3 py-2.5 rounded-lg font-label-md text-sm text-on-surface-variant hover:bg-surface-container transition-colors justify-center lg:justify-start">
          <span class="material-symbols-outlined text-[22px] flex-shrink-0">quiz</span>
          <span class="hidden lg:inline truncate">Group FAQs</span>
        </a>
        <a href="calendly.html" data-nav="calendly" title="Calendly" class="flex items-center gap-3 px-2 lg:px-3 py-2.5 rounded-lg font-label-md text-sm text-on-surface-variant hover:bg-surface-container transition-colors justify-center lg:justify-start">
          <span class="material-symbols-outlined text-[22px] flex-shrink-0">calendar_month</span>
          <span class="hidden lg:inline truncate">Calendly</span>
        </a>
        <a href="leads.html" data-nav="leads" title="Leads" class="flex items-center gap-3 px-2 lg:px-3 py-2.5 rounded-lg font-label-md text-sm text-on-surface-variant hover:bg-surface-container transition-colors justify-center lg:justify-start">
          <span class="material-symbols-outlined text-[22px] flex-shrink-0">group</span>
          <span class="hidden lg:inline truncate">Leads</span>
        </a>
      </aside>
      <script type="module">
        // Highlights the current page's link in the nav row above — every
        // dashboard page includes this partial, so this runs once per page
        // load regardless of which page it is.
        (function highlightNav() {
          const page = (location.pathname.split("/").pop() || "index.html").replace(".html", "");
          const key = page || "index";
          const link = document.querySelector(`#dashboard-nav a[data-nav="${key}"]`);
          if (link) {
            link.classList.add("bg-primary-container", "text-on-primary-container", "font-bold");
            link.classList.remove("text-on-surface-variant");
          }
        })();
      </script>
      <!-- Main Workspace -->
      <main class="flex-1 overflow-y-auto custom-scrollbar p-6 bg-background flex flex-col">
        <!-- flex-1 lets this stretch to fill any leftover vertical space when
             page content is shorter than the viewport, so the footer (a
             sibling of this div, further down in each page) still ends up
             pinned to the bottom of the screen instead of floating right
             below a short section list. When content overflows, this has no
             effect and the footer just sits at the true end, as normal. -->
        <div class="max-w-6xl mx-auto space-y-stack-gap flex-1 w-full">
